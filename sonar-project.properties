sonar.projectKey=sumeshj18_SonarQube-Sample
sonar.organization=sumeshj18

# Source and test directories
sonar.sources=src
sonar.tests=test

# Code coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.test.js
sonar.test.inclusions=test/**/*.test.js
