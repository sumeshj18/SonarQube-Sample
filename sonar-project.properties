# SonarCloud Organization & Project Key (Configure to match your SonarCloud project)
sonar.organization=sumeshj18
sonar.projectKey=sumeshj18_SonarQube-Sample
sonar.projectName=SonarQube-Sample

# Source and test directories
sonar.sources=src
sonar.tests=test

# Encodings
sonar.sourceEncoding=UTF-8

# Code coverage report path
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.test.js
sonar.test.inclusions=test/**/*.test.js
